name: Extract Magic Pin TEST ZIP

on:
  push:
    branches:
      - main
    paths:
      - "Magic-Pin-v*-TEST.zip"

  workflow_dispatch:
    inputs:
      zip_name:
        description: "Exact TEST ZIP filename already in the repository root"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: magic-pin-test-zip-extractor
  cancel-in-progress: false

jobs:
  extract-test-zip:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip extractor]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select exactly one uploaded TEST ZIP
        id: choose
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ZIP_NAME="${{ inputs.zip_name }}"
            test -n "$ZIP_NAME"

            test -f "$ZIP_NAME" || {
              echo "ERROR: Requested ZIP not found: $ZIP_NAME"
              exit 1
            }
          else
            mapfile -t CANDIDATES < <(
              git diff-tree \
                --no-commit-id \
                --name-only \
                --diff-filter=AM \
                -r "$GITHUB_SHA" \
                | grep -E '^Magic-Pin-v[0-9]+\.[0-9]+\.[0-9]+-TEST\.zip$' \
                || true
            )

            if [ "${#CANDIDATES[@]}" -ne 1 ]; then
              echo "ERROR: Expected exactly one TEST ZIP added or modified in this push."
              echo "Found ${#CANDIDATES[@]}."

              printf '  %s\n' "${CANDIDATES[@]:-<none>}"
              exit 1
            fi

            ZIP_NAME="${CANDIDATES[0]}"
          fi

          if [[ ! "$ZIP_NAME" =~ ^Magic-Pin-v([0-9]+\.[0-9]+\.[0-9]+)-TEST\.zip$ ]]; then
            echo "ERROR: Filename must match:"
            echo "Magic-Pin-v<version>-TEST.zip"
            exit 1
          fi

          EXPECTED_VERSION="${BASH_REMATCH[1]}"

          echo "Using ZIP: $ZIP_NAME"
          echo "Expected version: $EXPECTED_VERSION"
          sha256sum "$ZIP_NAME"

          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$EXPECTED_VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract package
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME="${{ steps.choose.outputs.zip_name }}"

          rm -rf _extract_test_zip
          mkdir -p _extract_test_zip

          unzip -q "$ZIP_NAME" -d _extract_test_zip

          SRC="_extract_test_zip"

          # Accept either:
          # 1. app files directly at ZIP root
          # 2. one wrapper folder containing the app files

          if [ ! -f "$SRC/index.html" ]; then
            TOP_DIRS="$(
              find "$SRC" \
                -mindepth 1 \
                -maxdepth 1 \
                -type d \
                | wc -l \
                | tr -d ' '
            )"

            TOP_FILES="$(
              find "$SRC" \
                -mindepth 1 \
                -maxdepth 1 \
                -type f \
                | wc -l \
                | tr -d ' '
            )"

            if [ "$TOP_DIRS" = "1" ] && [ "$TOP_FILES" = "0" ]; then
              ONLY_DIR="$(
                find "$SRC" \
                  -mindepth 1 \
                  -maxdepth 1 \
                  -type d \
                  | head -n 1
              )"

              if [ -f "$ONLY_DIR/index.html" ]; then
                SRC="$ONLY_DIR"
              fi
            fi
          fi

          test -f "$SRC/index.html" || {
            echo "ERROR: index.html not found in package."
            exit 1
          }

          echo "Validated package location:"
          echo "$SRC"

          echo "$SRC" > /tmp/magic_pin_src

      - name: Validate package version matches filename
        shell: bash
        run: |
          set -euo pipefail

          SRC="$(cat /tmp/magic_pin_src)"
          V="${{ steps.choose.outputs.version }}"

          echo "Checking package for v$V TEST..."

          grep -Fq "v$V TEST" "$SRC/index.html" || {
            echo "ERROR:"
            echo "index.html does not contain the exact visible version:"
            echo "v$V TEST"

            echo
            echo "Version markers actually present:"

            grep -Eo \
              'v?[0-9]+\.[0-9]+\.[0-9]+' \
              "$SRC/index.html" \
              | sort -u \
              | tail -n 30 \
              || true

            exit 1
          }

          grep -Fq "appVersion:\"$V\"" "$SRC/index.html" || {
            echo "ERROR:"
            echo "index.html appVersion does not match filename version $V"
            exit 1
          }

          if [ -f "$SRC/sw.js" ]; then
            grep -Fq "$V" "$SRC/sw.js" || {
              echo "ERROR:"
              echo "sw.js does not contain version $V."
              echo "Service-worker cache version was not bumped."
              exit 1
            }
          fi

          echo
          echo "Package version validation PASSED."
          echo "Filename version: $V"
          echo "Visible version: v$V TEST"
          echo "Internal appVersion: $V"

      - name: Replace deployed app files
        shell: bash
        run: |
          set -euo pipefail

          SRC="$(cat /tmp/magic_pin_src)"

          # Remove only known deployed app assets.
          # Preserve .git, .github and repository administration files.

          rm -f index.html
          rm -f sw.js
          rm -f manifest.webmanifest
          rm -f manifest.json

          rm -f icon-192.png
          rm -f icon-512.png

          rm -f Magic-Dragon-logo.jpeg
          rm -f Magic-Dragon-logo.jpg
          rm -f Magic-Dragon-logo.png

          rm -f README.txt

          # Copy every file/folder from the TEST package
          # into the repository root.

          cp -a "$SRC"/. .

          # Never let an app package overwrite GitHub automation.

          git restore --source=HEAD -- .github 2>/dev/null || true

          rm -rf _extract_test_zip

      - name: Verify deployed root is exact requested version
        shell: bash
        run: |
          set -euo pipefail

          V="${{ steps.choose.outputs.version }}"

          test -f index.html

          grep -Fq "v$V TEST" index.html || {
            echo "ERROR:"
            echo "Repository root index.html is not v$V TEST"
            exit 1
          }

          grep -Fq "appVersion:\"$V\"" index.html || {
            echo "ERROR:"
            echo "Repository root appVersion does not match $V"
            exit 1
          }

          if [ -f sw.js ]; then
            grep -Fq "$V" sw.js || {
              echo "ERROR:"
              echo "Repository root sw.js does not contain $V"
              exit 1
            }
          fi

          echo
          echo "DEPLOY ROOT VERSION VERIFIED:"
          echo "v$V TEST"

          echo
          echo "Root version markers:"

          grep -Eo \
            'v?[0-9]+\.[0-9]+\.[0-9]+' \
            index.html \
            | sort -u \
            | tail -n 30 \
            || true

      - name: Remove uploaded TEST ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -f "${{ steps.choose.outputs.zip_name }}"

      - name: Commit extracted TEST build
        shell: bash
        run: |
          set -euo pipefail

          V="${{ steps.choose.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "ERROR:"
            echo "No repository changes after extracting v$V."
            echo "Refusing silent success."
            exit 1
          fi

          git commit \
            -m "Deploy Magic Pin v$V TEST [skip extractor]"

          git push
